<div class="card">
  <!-- Titre de l'app qui disparaît à l'envoi -->
  <div class="app-title">
    <h1>DELMASIA</h1>
  </div>

  <!-- Zone d'échange de messages -->
  <div class="chat-container">
    <div class="chat-messages">
      <!-- Message utilisateur -->
      <div class="user-message" *ngIf="userText">
        {{ userText }}
      </div>

      <!-- Skeleton loader pendant le chargement -->
      <div class="skeleton-container" *ngIf="isLoading">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>

      <!-- Réponse de l'IA -->
      <div class="ai-response" *ngIf="responseText && !isLoading">
        {{ responseText }}
        <div class="pdf-preview" *ngIf="pdfFilename && pdfBlob">
          <img src="assets/pdf.png" alt="PDF" class="pdf-icon"/>
          <div class="pdf-info">
            <div class="pdf-name">{{ pdfFilename }}</div>
            <div class="pdf-size">{{ pdfSize }} Ko, PDF Document</div>
          </div>
        </div>

        <div style="position: relative;">
          <p-toast/>
          <p-speeddial [model]="items" direction="left"
                       [style]="{ position: 'absolute', top: 'calc(50% - 2rem)', right: 0 }"/>
        </div>
      </div>
    </div>

    <!-- Zone de saisie en bas de la page -->
    <div class="chat-input-container">
  <textarea
    [(ngModel)]="inputText"
    placeholder="Écrivez ici..."
    rows="1"
    class="chat-input"
    (keydown)="onKeydown($event)"
    [disabled]="isLoading"
    maxlength="500">
  </textarea>
      <div class="char-counter">{{ inputText.length }}/500</div>

      <button pButton
              pRipple
              severity="success"
              icon="pi pi-send"
              class="send-button"
              (click)="sendPrompt()"
              [disabled]="isLoading || inputText.trim().length === 0 || inputText.length > 500">
      </button>
    </div>

  </div>
</div>
<p-dialog header="Aperçu du PDF"
          [(visible)]="showPdfViewer"
          [style]="{width: '70vw'}"
          [modal]="true"
          [closable]="true"
          [dismissableMask]="true"
          (onHide)="onDialogHide()"
          [baseZIndex]="10000">

  <ng-container *ngIf="pdfBlob && pdfBlobUrl">
    <iframe
      [src]="pdfBlobUrl"
      type="application/pdf"
      width="100%"
      height="600px"
      style="border: none;"></iframe>
  </ng-container>

</p-dialog>
